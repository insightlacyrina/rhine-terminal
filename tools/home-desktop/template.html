<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rhine Terminal · Home Study</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101813;color:#cad4bd;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}canvas{position:fixed;inset:0;width:100%;height:100%}.frame{pointer-events:none;position:fixed;inset:4%;border:1px solid #65776455}.header{position:fixed;left:6%;top:7%;pointer-events:none}.eyebrow{font-size:11px;letter-spacing:.2em;color:#98a47c}.header b{display:block;font:600 22px system-ui;letter-spacing:.1em;color:#d0d9c3;margin-top:6px}.column{position:fixed;right:6%;top:25%;width:170px;color:#a6b49a;font-size:10px;letter-spacing:.13em;pointer-events:none}.column strong{display:block;color:#dbe6cf;font-size:13px;margin:13px 0}.line{border-top:1px solid #84977a66;padding:12px 0}.dot{display:inline-block;width:6px;height:6px;background:#a5b672;margin-right:8px}.footer{position:fixed;left:6%;bottom:7%;pointer-events:none;color:#8f9e83;letter-spacing:.15em;font-size:10px}.tools{position:fixed;z-index:3;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;border:1px solid #50624b;background:#16221de8;padding:8px 12px;white-space:nowrap;font:11px system-ui;color:#b8c6ae}.tools button{background:#bacb9e;border:0;color:#172117;padding:8px 13px;cursor:pointer;font-weight:600}.tools button:hover{background:#e0e8c9}.tools small{color:#9eae99}.error{position:fixed;top:0;left:0;color:#ff9b7a;background:#180d09;z-index:8;white-space:pre-wrap}.corner{position:fixed;top:7%;right:6%;color:#a7b69b;font-size:10px;letter-spacing:.12em;pointer-events:none}@media(max-width:650px){.column{right:7%;top:27%;width:120px;font-size:8px}.header b{font-size:17px}.tools small{display:none}}
</style></head><body><canvas id="scene"></canvas><div class="tools"><button id="demo">展开演示</button><button id="pause">暂停</button><small>桌面视觉预览 · 非真实解锁 · <span id="stats">正在测量…</span></small></div><div class="error" id="error"></div><script>
const DATA=__DATA__;const canvas=document.querySelector('#scene'),gl=canvas.getContext('webgl2',{alpha:false,antialias:true,depth:true,preserveDrawingBuffer:true});if(!gl)throw Error('需要支持 WebGL 2 的浏览器');
const from64=s=>Uint8Array.from(atob(s),x=>x.charCodeAt(0)),vertices=from64(DATA.vertices),indices=from64(DATA.indices);
function shader(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}function program(v,f){let p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,v));gl.attachShader(p,shader(gl.FRAGMENT_SHADER,f));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return p}
const background=program(DATA.bgVertex,DATA.bgFragment), bgVao=gl.createVertexArray();
const labelCanvas=document.createElement('canvas');labelCanvas.width=1024;labelCanvas.height=40;const lc=labelCanvas.getContext('2d');lc.clearRect(0,0,1024,40);lc.fillStyle='white';lc.font='18px monospace';lc.textBaseline='middle';lc.fillText('SIMULATED  /  RHINE SYSTEM    ·    STATUS NOMINAL    ·    LOCAL PREVIEW    ·    FIELD 001',12,20);const telemetry=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,telemetry);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,labelCanvas);
const obj=program(DATA.vertex,DATA.fragment),vao=gl.createVertexArray();gl.bindVertexArray(vao);let vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,vertices,gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,4,gl.FLOAT,false,24,0);gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,2,gl.FLOAT,false,24,16);let ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,indices,gl.STATIC_DRAW);let count=indices.length/4;const u=n=>gl.getUniformLocation(obj,n);
let running=true,last=0,t=0,reveal=1,started=-1,drawn=0,fps=0,frameTimes=[];
function resize(){let d=Math.min(devicePixelRatio||1,2),w=Math.round(innerWidth*d),h=Math.round(innerHeight*d);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}}
function draw(time,r){resize();gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(.050,.071,.056,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.disable(gl.DEPTH_TEST);gl.useProgram(background);gl.uniform2f(gl.getUniformLocation(background,'uSize'),canvas.width,canvas.height);gl.uniform1f(gl.getUniformLocation(background,'uTime'),time%120);gl.uniform1f(gl.getUniformLocation(background,'uReveal'),r);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,telemetry);gl.uniform1i(gl.getUniformLocation(background,'uTelemetry'),0);gl.uniform1f(gl.getUniformLocation(background,'uTelemetryOn'),1);gl.bindVertexArray(bgVao);gl.drawArrays(gl.TRIANGLES,0,3);gl.clear(gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.disable(gl.CULL_FACE);gl.useProgram(obj);gl.uniform2f(u('uSize'),canvas.width,canvas.height);gl.uniform1f(u('uTime'),time);gl.uniform1f(u('uReveal'),r);gl.uniform2f(u('uTilt'),0,0);gl.bindVertexArray(vao);gl.drawElements(gl.TRIANGLES,count,gl.UNSIGNED_INT,0);gl.bindVertexArray(null);drawn++}
function loop(now){requestAnimationFrame(loop);if(!running||document.hidden){last=now;return}let dt=last?Math.min((now-last)/1000,.1):0;last=now;t+=dt;if(started>=0){reveal=Math.min(1,(t-started)/1.15);reveal=reveal*reveal*(3-2*reveal);if(reveal>=1)started=-1}draw(t,reveal);frameTimes.push(now);while(frameTimes.length&&frameTimes[0]<now-2000)frameTimes.shift();fps=frameTimes.length>1?(frameTimes.length-1)*1000/(frameTimes.at(-1)-frameTimes[0]):0;document.querySelector('#stats').textContent=fps.toFixed(1)+' 帧/秒（浏览器显示限制）'}
function trigger(){started=t;reveal=0;running=true;document.querySelector('#pause').textContent='暂停'}document.querySelector('#demo').onclick=trigger;document.querySelector('#pause').onclick=()=>{running=!running;last=0;frameTimes=[];document.querySelector('#pause').textContent=running?'暂停':'继续'};
const ext=gl.getExtension('EXT_disjoint_timer_query_webgl2'),debug=gl.getExtension('WEBGL_debug_renderer_info');function summary(a){a.sort((x,y)=>x-y);return {n:a.length,p50:a[Math.floor((a.length-1)*.5)],p95:a[Math.floor((a.length-1)*.95)]}}
async function gpuBenchmark(n=60){if(running)throw Error('pause first');if(!ext)return {available:false};let fb=gl.createFramebuffer(),tex=gl.createTexture(),depth=gl.createRenderbuffer();gl.bindTexture(gl.TEXTURE_2D,tex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,canvas.width,canvas.height,0,gl.RGBA,gl.UNSIGNED_BYTE,null);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.bindRenderbuffer(gl.RENDERBUFFER,depth);gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT24,canvas.width,canvas.height);gl.bindFramebuffer(gl.FRAMEBUFFER,fb);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,depth);if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE)throw Error('framebuffer incomplete');let qs=[],wall=[],pixel=new Uint8Array(4);try{for(let i=0;i<5;i++)draw(t+i/60,1);for(let i=0;i<n;i++){let q=gl.createQuery(),start=performance.now();gl.beginQuery(ext.TIME_ELAPSED_EXT,q);draw(t+i/60,1);gl.endQuery(ext.TIME_ELAPSED_EXT);gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);wall.push(performance.now()-start);qs.push(q)}gl.flush();let start=performance.now();while(!qs.every(q=>gl.getQueryParameter(q,gl.QUERY_RESULT_AVAILABLE))){if(performance.now()-start>30000)throw Error('GPU timing timeout');await new Promise(r=>setTimeout(r,10))}let disjoint=gl.getParameter(ext.GPU_DISJOINT_EXT);return {available:true,valid:!disjoint,gpuMs:summary(qs.map(q=>gl.getQueryParameter(q,gl.QUERY_RESULT)/1e6)),serialWallMs:summary(wall),note:'desktop offscreen GPU elapsed and serial draw + 1px synchronous readback; includes canonical background and sculpture; excludes Android timing'}}finally{qs.forEach(q=>gl.deleteQuery(q));gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.deleteFramebuffer(fb);gl.deleteTexture(tex);gl.deleteRenderbuffer(depth)}}
window.rhineHome={trigger,draw,gpuBenchmark,hashes:DATA.hashes,triangleCount:count/3,renderer:debug?gl.getParameter(debug.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER),state:()=>({running,t,reveal,drawn,fps,width:canvas.width,height:canvas.height,error:gl.getError()})};try{requestAnimationFrame(loop)}catch(e){document.querySelector('#error').textContent=e.stack;console.error(e)}
</script></body></html>
