<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rhine Terminal · Carbon Preview</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#101310;color:#c6d5c3;font-family:system-ui,sans-serif}body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}.stage{position:relative;aspect-ratio:8/5;width:min(calc((100vh - 84px)*1.6),100%);max-height:calc(100vh - 84px);background:#070b09;box-shadow:0 8px 36px #000b}.stage.portrait{aspect-ratio:5/8;width:min(calc((100vh - 84px)*.625),100%)}canvas{position:absolute;inset:0;width:100%;height:100%}.toolbar{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;font-size:12px;color:#a5b6a5}.toolbar button{color:#d7e6d4;background:#27352b;border:1px solid #6c806b;border-radius:3px;padding:7px 14px;cursor:pointer}.toolbar button:hover{background:#405843}.sample{color:#cedcb9}.error{position:fixed;top:0;left:0;z-index:5;color:#ffd5c7;background:#48180d;white-space:pre-wrap}
</style></head><body><div class="stage" id="stage"><canvas id="scene"></canvas><canvas id="console"></canvas></div><div class="toolbar"><button id="orientation">切换竖屏</button><button id="pause">暂停</button><button id="replay">重播展开</button><button id="visible">重播已显示时展开</button><button id="theme">切换浅色</button><span class="sample">示例快照 · 非设备实时数据</span></div><div class="error" id="error"></div><script>
const DATA=__DATA__;
let fontReady=false; new FontFace('RhineMono',`url(data:font/ttf;base64,${DATA.font})`).load().then(face=>{document.fonts.add(face);fontReady=true}).catch(console.error);
const stage=document.querySelector('#stage'), canvas=document.querySelector('#scene'), terminal=document.querySelector('#console'),ctx=terminal.getContext('2d');
const gl=canvas.getContext('webgl2',{alpha:false,antialias:true,preserveDrawingBuffer:true});if(!gl)throw Error('浏览器需要支持 WebGL 2');
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
function makeProgram(v,f){const p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,v));gl.attachShader(p,shader(gl.FRAGMENT_SHADER,f));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return p}
const program=makeProgram(DATA.vertex,DATA.fragment),vao=gl.createVertexArray(),tex=gl.createTexture(),img=new Image();img.src=DATA.image;let ready=false;
img.onload=()=>{gl.bindTexture(gl.TEXTURE_2D,tex);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);gl.generateMipmap(gl.TEXTURE_2D);ready=true};
let landscape=true,running=true,dark=true,t=0,last=0,lastRow=0,rows=[],rowIndex=0,frames=0;
let unfoldStart=-2,fromVisible=false,reveal=1;
function clamp01(x){return Math.max(0,Math.min(1,x))}
function quintic(x){x=clamp01(x);return x*x*x*(x*(6*x-15)+10)}
function cubicOut(x){x=clamp01(x);return 1-(1-x)**3}
// Mirrors ArchiveTimeline.homeReveal; 1.15 seconds is native UNFOLD_NANOS.
function homeReveal(x,visible){return visible?1-.29*quintic(x/.24)+.29*quintic((x-.31)/.69):.64*cubicOut(x/.46)+.36*quintic((x-.28)/.72)}
const samples=['$ rhine probe --local','[sample] time          snapshot','[sample] model / SDK   snapshot / unavailable','[sample] RAM available 2.76 GiB','[sample] RAM kernel    10.92 GiB total','[sample] RAM pressure  unavailable','[sample] battery       84%','[sample] power source  USB','[sample] power state   charging','[sample] battery temp  34.2 C','[sample] thermal       NONE','[sample] display       120.0 Hz','[sample] wallpaper     unavailable','[sample] uptime        unavailable','> waiting for next snapshot'];
function resize(){const w=landscape?2560:1600,h=landscape?1600:2560;if(canvas.width!==w||canvas.height!==h){canvas.width=terminal.width=w;canvas.height=terminal.height=h}}
function addRow(){rows.push(samples[rowIndex++%samples.length]);if(rows.length>128)rows.shift()}
for(let i=0;i<36;i++)addRow();
function drawTerminal(){const w=terminal.width,h=terminal.height,L=landscape,left=w*(L?.04:.05),right=w*(L?.50:.95),top=h*(L?.135:.46),bottom=h*.90,fh=Math.max(9,Math.min(24,h*(L?.016:.012))),pad=Math.max(8,fh*1.3),header=fh*2.2,line=fh*1.2;ctx.clearRect(0,0,w,h);ctx.fillStyle='rgba(54,69,48,.75)';ctx.fillRect(left,top,right-left,bottom-top);let border=Math.max(1,h*.001);ctx.clearRect(left+border,top+border,right-left-border*2,bottom-top-border*2);ctx.fillStyle='rgba(7,16,10,.20)';ctx.fillRect(left+border,top+border,right-left-border*2,bottom-top-border*2);ctx.font=`${fh}px RhineMono`;ctx.textBaseline='top';ctx.fillStyle='rgba(158,181,143,.85)';ctx.fillText('RHINE LAB / DEVICE CONSOLE   SAMPLE',left+pad,top+pad*.75);ctx.save();ctx.beginPath();ctx.rect(left+pad,top+header,right-left-pad*2,bottom-top-header-pad);ctx.clip();const cols=Math.floor((right-left-pad*2)/(fh*.62)),visible=Math.ceil((bottom-top-header-pad)/line)+2,shift=running?line*(1-Math.min(1,(t-lastRow)/.0625)):0;for(let n=0;n<Math.min(visible,rows.length);n++){let s=rows[rows.length-1-n];ctx.fillStyle=/^[$>#]/.test(s)?'rgba(194,214,115,.98)':'rgba(186,204,179,.92)';ctx.fillText(s.slice(0,cols),left+pad,bottom-pad-fh-n*line+shift)}ctx.restore()}
function draw(){resize();gl.viewport(0,0,canvas.width,canvas.height);gl.useProgram(program);gl.bindVertexArray(vao);gl.uniform2f(gl.getUniformLocation(program,'uSize'),canvas.width,canvas.height);gl.uniform1f(gl.getUniformLocation(program,'uDark'),dark?1:0);gl.uniform1f(gl.getUniformLocation(program,'uReveal'),reveal);gl.uniform1f(gl.getUniformLocation(program,'uTime'),t);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.uniform1i(gl.getUniformLocation(program,'uCardTex'),0);if(ready)gl.drawArrays(gl.TRIANGLES,0,3);if(dark)drawTerminal();else ctx.clearRect(0,0,terminal.width,terminal.height);frames++}
function loop(now){requestAnimationFrame(loop);if(!running||document.hidden){last=now;return}const dt=last?Math.min((now-last)/1000,.1):0;last=now;t+=dt;reveal=homeReveal((t-unfoldStart)/1.15,fromVisible);while(t-lastRow>=.0625){lastRow+=.0625;addRow()}draw()}
function replay(visible){fromVisible=visible;unfoldStart=t;reveal=homeReveal(0,visible);if(!running){running=true;last=0;document.querySelector('#pause').textContent='暂停'}draw()}
document.querySelector('#replay').onclick=()=>replay(false);document.querySelector('#visible').onclick=()=>replay(true);document.querySelector('#theme').onclick=()=>{dark=!dark;document.querySelector('#theme').textContent=dark?'切换浅色':'切换深色';draw()};
document.querySelector('#orientation').onclick=()=>{landscape=!landscape;stage.classList.toggle('portrait',!landscape);document.querySelector('#orientation').textContent=landscape?'切换竖屏':'切换横屏';draw()};document.querySelector('#pause').onclick=()=>{running=!running;last=0;document.querySelector('#pause').textContent=running?'暂停':'继续';draw()};window.carbonPreview={state:()=>({landscape,running,dark,t,reveal,fromVisible,frames,rows:rowIndex,width:canvas.width,height:canvas.height,ready,fontReady,error:gl.getError()}),hashes:DATA.hashes};requestAnimationFrame(loop);
</script></body></html>
