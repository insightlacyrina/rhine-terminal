plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.rhine.terminal'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.rhine.terminal'
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName '0.8.0'
        testInstrumentationRunner 'dev.rhine.terminal.TerminalInstrumentation'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}
